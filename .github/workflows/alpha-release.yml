name: Publish Heimdall Alpha

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*-alpha.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Alpha tag to recover
        required: true
        type: string

concurrency:
  group: alpha-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed immutable Alpha
    if: github.repository_owner == 'mastercook777'
    runs-on: ubuntu-latest
    environment: alpha-release

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Validate tag and release notes
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$DISPATCH_RELEASE_TAG"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Unsupported Alpha tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "The requested Alpha tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "$CHECKED_OUT_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "Checked-out source does not match $RELEASE_TAG." >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          APPLICATION_ID="$(sed -n 's/^APPLICATION_ID=//p' release.properties)"
          CONFIGURED_CERT="$(sed -n 's/^RELEASE_CERT_SHA256=//p' release.properties | tr '[:lower:]' '[:upper:]' | tr -d ':' | tr -d '[:space:]')"
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "VERSION_CODE must be a positive integer." >&2
            exit 1
          fi
          if [[ "$VERSION_NAME" != "$VERSION" ]]; then
            echo "VERSION_NAME does not match $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$APPLICATION_ID" != "com.mastercook777.heimdall" ]]; then
            echo "Unexpected release application ID: $APPLICATION_ID" >&2
            exit 1
          fi
          if [[ ! "$CONFIGURED_CERT" =~ ^[0-9A-F]{64}$ ]]; then
            echo "The repository release certificate fingerprint is malformed." >&2
            exit 1
          fi
          NOTES="docs/releases/${RELEASE_TAG}.md"
          test -f "$NOTES"
          if grep -Eq 'Draft|TBD' "$NOTES"; then
            echo "Release notes are not final: $NOTES" >&2
            exit 1
          fi
          echo "HEIMDALL_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "HEIMDALL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HEIMDALL_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "HEIMDALL_APPLICATION_ID=$APPLICATION_ID" >> "$GITHUB_ENV"
          echo "HEIMDALL_CONFIGURED_CERT_SHA256=$CONFIGURED_CERT" >> "$GITHUB_ENV"
          echo "HEIMDALL_RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"
          echo "HEIMDALL_SOURCE_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"

      - name: Verify release readiness
        shell: pwsh
        run: ./scripts/verify_release_readiness.ps1 -ReleaseTag $env:HEIMDALL_RELEASE_TAG -RequireExistingTag

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;30.0.14904198"

      - name: Verify public source boundary
        shell: pwsh
        run: ./scripts/verify_source_boundary.ps1

      - name: Restore private Alpha keystore
        shell: bash
        env:
          HEIMDALL_RELEASE_KEYSTORE_BASE64: ${{ secrets.HEIMDALL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HEIMDALL_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$HEIMDALL_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/heimdall-alpha.jks"
          chmod 600 "$RUNNER_TEMP/heimdall-alpha.jks"

      - name: Build signed release and lint
        env:
          HEIMDALL_RELEASE_KEYSTORE: ${{ runner.temp }}/heimdall-alpha.jks
          HEIMDALL_RELEASE_STORE_PASSWORD: ${{ secrets.HEIMDALL_RELEASE_STORE_PASSWORD }}
          HEIMDALL_RELEASE_KEY_ALIAS: ${{ secrets.HEIMDALL_RELEASE_KEY_ALIAS }}
          HEIMDALL_RELEASE_KEY_PASSWORD: ${{ secrets.HEIMDALL_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :assistant:assembleRelease :assistant:lintRelease -PheimdallRequireReleaseSigning=true --no-daemon

      - name: Verify package, version, signer, and checksum
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.HEIMDALL_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="assistant/build/outputs/apk/release/heimdall-release.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING="$("$AAPT" dump badging "$APK")"
          ACTUAL_PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_VERSION_CODE="$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_VERSION="$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          test "$ACTUAL_PACKAGE" = "$HEIMDALL_APPLICATION_ID"
          test "$ACTUAL_VERSION_CODE" = "$HEIMDALL_VERSION_CODE"
          test "$ACTUAL_VERSION" = "$HEIMDALL_VERSION"

          "$APKSIGNER" verify --verbose "$APK"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          ACTUAL_CERT="$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' <<< "$CERT_OUTPUT" | tr '[:lower:]' '[:upper:]' | tr -d ':' | tr -d '[:space:]')"
          EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':' | tr -d '[:space:]')"
          if [[ ! "$ACTUAL_CERT" =~ ^[0-9A-F]{64}$ ]]; then
            echo "Could not parse the APK signing certificate SHA-256." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_CERT" =~ ^[0-9A-F]{64}$ ]]; then
            echo "The configured certificate SHA-256 is malformed." >&2
            exit 1
          fi
          if [[ "$EXPECTED_CERT" != "$HEIMDALL_CONFIGURED_CERT_SHA256" ]]; then
            echo "The protected certificate fingerprint does not match release.properties." >&2
            exit 1
          fi
          if [[ "$ACTUAL_CERT" != "$HEIMDALL_CONFIGURED_CERT_SHA256" ]]; then
            echo "The APK signing certificate does not match the approved Alpha signer: $ACTUAL_CERT" >&2
            exit 1
          fi

          mkdir -p dist
          ASSET_NAME="heimdall-${HEIMDALL_RELEASE_TAG}.apk"
          cp "$APK" "dist/$ASSET_NAME"
          (
            cd dist
            sha256sum "$ASSET_NAME" > SHA256SUMS.txt
          )
          {
            cat "$HEIMDALL_RELEASE_NOTES"
            printf '\n## Build integrity\n\n'
            printf -- '- Source commit: `%s`\n' "$HEIMDALL_SOURCE_COMMIT"
            printf -- '- Package: `%s`\n' "$HEIMDALL_APPLICATION_ID"
            printf -- '- Version code: `%s`\n' "$HEIMDALL_VERSION_CODE"
            printf -- '- Version: `%s`\n' "$HEIMDALL_VERSION"
            printf -- '- Signing certificate SHA-256: `%s`\n' "$ACTUAL_CERT"
            printf -- '- APK SHA-256: `%s`\n' "$(cut -d ' ' -f 1 dist/SHA256SUMS.txt)"
          } > dist/RELEASE_BODY.md

      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$HEIMDALL_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists and will not be overwritten: $HEIMDALL_RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$HEIMDALL_RELEASE_TAG" \
            "dist/heimdall-${HEIMDALL_RELEASE_TAG}.apk" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --prerelease \
            --title "Heimdall ${HEIMDALL_RELEASE_TAG}" \
            --notes-file dist/RELEASE_BODY.md
