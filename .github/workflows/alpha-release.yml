name: Promote Heimdall Alpha Candidate

permissions:
  actions: read
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Alpha tag to publish
        required: true
        type: string
      candidate_run_id:
        description: Successful Build Heimdall Alpha Candidate workflow run ID
        required: true
        type: string
      candidate_artifact_name:
        description: Exact immutable candidate artifact name from that run
        required: true
        type: string
      approved_apk_sha256:
        description: Exact APK SHA-256 accepted by the owner on Thor
        required: true
        type: string

concurrency:
  group: alpha-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Promote exact owner-accepted artifact
    if: github.repository_owner == 'mastercook777'
    runs-on: ubuntu-latest
    environment: alpha-release

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Validate tag, source, and release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVED_APK_SHA256: ${{ inputs.approved_apk_sha256 }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Unsupported Alpha tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "candidate_run_id must be a positive integer." >&2
            exit 1
          fi
          if [[ ! "$APPROVED_APK_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "approved_apk_sha256 must contain exactly 64 hexadecimal characters." >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_ARTIFACT_NAME" =~ ^heimdall-alpha-candidate-[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+-[1-9][0-9]*-[1-9][0-9]*$ ]]; then
            echo "Unexpected candidate artifact name: $CANDIDATE_ARTIFACT_NAME" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "The requested Alpha tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "$CHECKED_OUT_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "Checked-out source does not match $RELEASE_TAG." >&2
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          APPLICATION_ID="$(sed -n 's/^APPLICATION_ID=//p' release.properties)"
          CONFIGURED_CERT="$(sed -n 's/^RELEASE_CERT_SHA256=//p' release.properties | tr '[:lower:]' '[:upper:]' | tr -d ':' | tr -d '[:space:]')"
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "VERSION_CODE must be a positive integer." >&2
            exit 1
          fi
          if [[ "$VERSION_NAME" != "$VERSION" ]]; then
            echo "VERSION_NAME does not match $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$APPLICATION_ID" != "com.mastercook777.heimdall" ]]; then
            echo "Unexpected release application ID: $APPLICATION_ID" >&2
            exit 1
          fi
          if [[ ! "$CONFIGURED_CERT" =~ ^[0-9A-F]{64}$ ]]; then
            echo "The repository release certificate fingerprint is malformed." >&2
            exit 1
          fi
          NOTES="docs/releases/${RELEASE_TAG}.md"
          test -f "$NOTES"
          if grep -Eiq '\b(Draft|TBD)\b' "$NOTES"; then
            echo "Release notes are not final: $NOTES" >&2
            exit 1
          fi

          echo "HEIMDALL_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "HEIMDALL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HEIMDALL_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "HEIMDALL_APPLICATION_ID=$APPLICATION_ID" >> "$GITHUB_ENV"
          echo "HEIMDALL_CONFIGURED_CERT_SHA256=$CONFIGURED_CERT" >> "$GITHUB_ENV"
          echo "HEIMDALL_RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"
          echo "HEIMDALL_SOURCE_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"
          echo "HEIMDALL_APPROVED_APK_SHA256=${APPROVED_APK_SHA256^^}" >> "$GITHUB_ENV"
          echo "HEIMDALL_CANDIDATE_RUN_ID=$CANDIDATE_RUN_ID" >> "$GITHUB_ENV"
          echo "HEIMDALL_CANDIDATE_ARTIFACT_NAME=$CANDIDATE_ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Verify release readiness
        shell: pwsh
        run: ./scripts/verify_release_readiness.ps1 -ReleaseTag $env:HEIMDALL_RELEASE_TAG -RequireExistingTag

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Verify public source boundary
        shell: pwsh
        run: ./scripts/verify_source_boundary.ps1

      - name: Download exact immutable candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify candidate identity and approved SHA
        shell: pwsh
        run: |
          ./scripts/verify_alpha_candidate.ps1 `
              -CandidateDirectory candidate `
              -ReleaseTag $env:HEIMDALL_RELEASE_TAG `
              -ExpectedSourceCommit $env:HEIMDALL_SOURCE_COMMIT `
              -ApprovedApkSha256 $env:HEIMDALL_APPROVED_APK_SHA256 `
              -ExpectedWorkflowRunId $env:HEIMDALL_CANDIDATE_RUN_ID `
              -ExpectedArtifactName $env:HEIMDALL_CANDIDATE_ARTIFACT_NAME `
              -OutputDirectory dist

      - name: Build release body from verified candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            cat "$HEIMDALL_RELEASE_NOTES"
            printf '\n## Build integrity\n\n'
            printf -- '- Source commit: `%s`\n' "$HEIMDALL_SOURCE_COMMIT"
            printf -- '- Candidate workflow run: `%s`\n' "$HEIMDALL_CANDIDATE_RUN_ID"
            printf -- '- Candidate artifact: `%s`\n' "$HEIMDALL_CANDIDATE_ARTIFACT_NAME"
            printf -- '- Package: `%s`\n' "$HEIMDALL_APPLICATION_ID"
            printf -- '- Version code: `%s`\n' "$HEIMDALL_VERSION_CODE"
            printf -- '- Version: `%s`\n' "$HEIMDALL_VERSION"
            printf -- '- Signing certificate SHA-256: `%s`\n' "$HEIMDALL_CONFIGURED_CERT_SHA256"
            printf -- '- Owner-approved APK SHA-256: `%s`\n' "$HEIMDALL_APPROVED_APK_SHA256"
          } > dist/RELEASE_BODY.md

      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$HEIMDALL_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists and will not be overwritten: $HEIMDALL_RELEASE_TAG" >&2
            exit 1
          fi

      - name: Upload verified assets to a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$HEIMDALL_RELEASE_TAG" \
            "dist/heimdall-${HEIMDALL_RELEASE_TAG}.apk" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "Heimdall ${HEIMDALL_RELEASE_TAG}" \
            --notes-file dist/RELEASE_BODY.md

      - name: Redownload and verify draft release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path post-draft | Out-Null
          gh release download $env:HEIMDALL_RELEASE_TAG --dir post-draft
          if ($LASTEXITCODE -ne 0) { throw "Could not redownload draft release assets." }
          $assetName = "heimdall-$($env:HEIMDALL_RELEASE_TAG).apk"
          $checksum = (Get-Content -LiteralPath "post-draft/SHA256SUMS.txt" -Raw).Trim()
          if ($checksum -ne "$($env:HEIMDALL_APPROVED_APK_SHA256)  $assetName") {
              throw "Draft Release checksum asset does not match the approved candidate."
          }
          ./scripts/verify_alpha_artifact.ps1 `
              -ApkPath "post-draft/$assetName" `
              -ExpectedPackage $env:HEIMDALL_APPLICATION_ID `
              -ExpectedVersionCode $env:HEIMDALL_VERSION_CODE `
              -ExpectedVersionName $env:HEIMDALL_VERSION `
              -ExpectedCertificateSha256 $env:HEIMDALL_CONFIGURED_CERT_SHA256 `
              -ExpectedApkSha256 $env:HEIMDALL_APPROVED_APK_SHA256

      - name: Publish the verified immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$HEIMDALL_RELEASE_TAG" --draft=false --prerelease

      - name: Redownload and verify public release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path post-public | Out-Null
          gh release download $env:HEIMDALL_RELEASE_TAG --dir post-public
          if ($LASTEXITCODE -ne 0) { throw "Could not redownload public release assets." }
          $assetName = "heimdall-$($env:HEIMDALL_RELEASE_TAG).apk"
          $checksum = (Get-Content -LiteralPath "post-public/SHA256SUMS.txt" -Raw).Trim()
          if ($checksum -ne "$($env:HEIMDALL_APPROVED_APK_SHA256)  $assetName") {
              throw "Public Release checksum asset does not match the approved candidate."
          }
          ./scripts/verify_alpha_artifact.ps1 `
              -ApkPath "post-public/$assetName" `
              -ExpectedPackage $env:HEIMDALL_APPLICATION_ID `
              -ExpectedVersionCode $env:HEIMDALL_VERSION_CODE `
              -ExpectedVersionName $env:HEIMDALL_VERSION `
              -ExpectedCertificateSha256 $env:HEIMDALL_CONFIGURED_CERT_SHA256 `
              -ExpectedApkSha256 $env:HEIMDALL_APPROVED_APK_SHA256
          $release = gh release view $env:HEIMDALL_RELEASE_TAG --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the published Release." }
          if ($release.isDraft -or -not $release.isPrerelease) {
              throw "Published Release state is not an immutable public prerelease."
          }
          $assetNames = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expectedNames = @("SHA256SUMS.txt", $assetName) | Sort-Object
          if (($assetNames -join "`n") -ne ($expectedNames -join "`n")) {
              throw "Published Release asset set is unexpected: $($assetNames -join ', ')"
          }
          @(
              "## Exact artifact promotion complete",
              "",
              "- Tag: ``$($env:HEIMDALL_RELEASE_TAG)``",
              "- Candidate run: ``$($env:HEIMDALL_CANDIDATE_RUN_ID)``",
              "- Candidate artifact: ``$($env:HEIMDALL_CANDIDATE_ARTIFACT_NAME)``",
              "- Approved and published APK SHA-256: ``$($env:HEIMDALL_APPROVED_APK_SHA256)``",
              "- Post-public byte verification: passed",
              "- Thor install/launch of the public download: owner verification still required"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
