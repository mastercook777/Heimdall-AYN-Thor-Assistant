name: Android CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build and lint Heimdall
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;30.0.14904198"

      - name: Verify public source boundary
        shell: pwsh
        run: ./scripts/verify_source_boundary.ps1

      - name: Build and lint
        run: |
          chmod +x ./gradlew
          ./gradlew :assistant:assembleDebug :assistant:lintDebug --no-daemon
